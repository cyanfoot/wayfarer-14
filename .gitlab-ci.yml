include:
  - local: .gitlab/ci/publish.yml
  - local: .gitlab/ci/validate-rsis.yml
  - local: .gitlab/ci/validate-mapfiles.yml
  - local: .gitlab/ci/publish-changelog.yml
  - local: .gitlab/ci/changelog.yml

stages:
  - lint
  - test
  - deploy
  - notify

workflow:
  rules:
    - if: '($CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "schedule") && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    # Push pipelines on the default branch exist only for generate_changelog; all other jobs exclude push.
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - when: never

# Override included rules so both validators always gate eligible MR builds.
validate_rsis:
  rules: &merge_request_checks
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_DRAFT == "true"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && ($CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "master" || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "staging" || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "stable")'
    - when: never

validate_mapfiles:
  rules: *merge_request_checks

yaml_linter:
  stage: lint
  image: mcr.microsoft.com/dotnet/sdk:9.0
  interruptible: true
  variables:
    GIT_SUBMODULE_STRATEGY: recursive
    NUGET_PACKAGES: "$CI_PROJECT_DIR/.nuget/packages"
    DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
  cache:
    key: "nuget-9.0"
    paths:
      - .nuget/packages
    policy: pull-push
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends libfreetype6 libfontconfig1
    - rm -rf /var/lib/apt/lists/*
  rules:
    - when: never
  script:
    - dotnet restore Content.YAMLLinter/Content.YAMLLinter.csproj
    - dotnet build Content.YAMLLinter/Content.YAMLLinter.csproj --configuration Release --no-restore /p:WarningsAsErrors= /m
    - dotnet run --project Content.YAMLLinter/Content.YAMLLinter.csproj --configuration Release --no-build

build_test_debug:
  stage: test
  needs:
    - job: validate_rsis
      artifacts: false
    - job: validate_mapfiles
      artifacts: false
  image: mcr.microsoft.com/dotnet/sdk:9.0
  interruptible: true
  variables:
    GIT_SUBMODULE_STRATEGY: recursive
    NUGET_PACKAGES: "$CI_PROJECT_DIR/.nuget/packages"
    DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
  cache:
    key: "nuget-9.0"
    paths:
      - .nuget/packages
    policy: pull-push
  rules: *merge_request_checks
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends libfreetype6 libfontconfig1
    - rm -rf /var/lib/apt/lists/*
    - git submodule sync --recursive
    - git submodule update --init --recursive
    - cd RobustToolbox
    - git submodule update --init --recursive
    - cd ..
  script:
    - dotnet restore
    - dotnet build --configuration DebugOpt --no-restore /m
    - dotnet test --no-build --configuration DebugOpt Content.Tests/Content.Tests.csproj -- NUnit.ConsoleOut=0
    - DOTNET_gcServer=1 dotnet test --no-build --configuration DebugOpt Content.IntegrationTests/Content.IntegrationTests.csproj --filter "FullyQualifiedName!~ShipyardTest" -- NUnit.ConsoleOut=0 NUnit.MapWarningTo=Failed
