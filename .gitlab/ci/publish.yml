# Production publishing is deliberately restricted to this project's protected
# default branch. Push and merge request pipelines never publish to the CDN.
publish_cdn:
  stage: deploy
  image: mcr.microsoft.com/dotnet/sdk:9.0
  resource_group: publish
  # Do not cancel an in-progress multi-request CDN upload automatically.
  interruptible: false
  environment:
    name: production
  variables:
    GIT_SUBMODULE_STRATEGY: recursive
    GIT_DEPTH: "0"
    GIT_SUBMODULE_DEPTH: "0"
    NUGET_PACKAGES: "$CI_PROJECT_DIR/.nuget/packages"
    DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
  cache:
    key: "nuget-9.0"
    paths:
      - .nuget/packages
    policy: pull-push
  rules:
    - if: '$CI_PROJECT_PATH == "projectwayfarer/wayfarer14" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_REF_PROTECTED == "true" && ($CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "schedule")'
    - when: never
  before_script:
    - 'test -n "$PUBLISH_TOKEN" || { echo "PUBLISH_TOKEN must be configured in GitLab CI/CD variables."; exit 1; }'
    - apt-get update
    - apt-get install -y --no-install-recommends git python3-requests python3-paramiko python3-lxml python3-yaml libfreetype6 libfontconfig1
    - rm -rf /var/lib/apt/lists/*
    # The uploader resolves the engine release using git describe in this submodule.
    - git -C RobustToolbox fetch origin --tags
    - git -C RobustToolbox describe --tags --abbrev=0
  script:
    - dotnet restore
    - dotnet build Content.Packaging --configuration Release --no-restore /m
    - dotnet run --project Content.Packaging server --platform win-x64 --platform linux-x64 --platform osx-x64 --platform linux-arm64
    - dotnet run --project Content.Packaging client --no-wipe-release
    # Compatibility with the existing uploader; GitLab's full commit SHA is the CDN version.
    - GITHUB_SHA="$CI_COMMIT_SHA" python3 Tools/publish_multi_request.py
    # Preserve the old non-blocking RSS step. Its SSH/feed settings must be
    # configured for Wayfarer before enabling it with CHANGELOG_RSS_KEY.
    - |
      if [ -n "${CHANGELOG_RSS_KEY:-}" ]; then
        python3 Tools/actions_changelog_rss.py || echo "WARNING: RSS changelog publishing failed; CDN publication succeeded."
      fi